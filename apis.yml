name: Baker Technologies
description: >-
  Baker Technologies (Baker) was a Denver, Colorado based customer relationship
  management (CRM) and marketing platform built for the cannabis industry,
  founded in 2014 by David Champion, Joel Milton, and Roger Obando. A graduate of
  the 500 Startups accelerator, Baker helped licensed dispensaries grow revenue and
  build customer relationships through online ordering, loyalty programs, SMS/text
  messaging, and analytics, and launched an expanded integrations program with a
  developer API connecting dispensaries to 20+ ancillary cannabis services. The
  company raised approximately $11.75M (including an $8M Series A) before being
  acquired by TILT Holdings in 2018. The trybaker.com domain is now parked and
  listed for sale, indicating the product has been discontinued; no live developer
  portal, API documentation, or specifications are publicly available.
